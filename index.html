<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#172526">
  <title>FFS 2027 Catalog</title>
  <link rel="stylesheet" href="styles.css">
  <script src="vendor/page-flip.browser.js" defer></script>
  <script src="review.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header><a class="brand" href="./" aria-label="FFS catalog home">FFS<span>CATALOG / 2027</span></a><button id="review-toggle" type="button" aria-pressed="false" disabled>Review mode</button></header>
  <main>
    <div class="viewer" id="viewer" aria-label="Catalog viewer">
      <div id="book"></div>
      <p id="message" role="status">Loading catalog…</p>
    </div>
    <nav aria-label="Catalog navigation">
      <button id="previous" type="button" aria-label="Previous page" disabled>← <span>Previous</span></button>
      <output id="counter" aria-live="polite" aria-atomic="true">Loading…</output>
      <button id="next" type="button" aria-label="Next page" disabled><span>Next</span> →</button>
    </nav>
    <p class="hint">Drag a corner or use the arrow keys to turn the page.</p>
    <p id="review-status" class="hint" role="status" hidden>Shared review: comments are saved to the review sheet and visible to everyone with the catalog link.</p>
    <noscript>Enable JavaScript to use the catalog viewer.</noscript>
  </main>
</body>
</html>
